services:
  app:
    build: ..
    image: cropotter:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      TRUST_CROPOTTER_PROXY: "1"
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "1.0"
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
