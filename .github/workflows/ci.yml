name: Verify CropOtter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run typecheck:web && npm run typecheck:local
      - run: npm test && npm run test:web && npm run test:local && npm run test:agents
      - run: npm run fixtures && npm run build:web
      - run: npm run verify:local:packed && npm run verify:agents
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:web:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
